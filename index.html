<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ጉዞ ፕላስ (Guzo Plus)</title>
  <link rel="manifest" href="https://guzo-plus-05wo.onrender.com/manifest.json" />
  <meta name="theme-color" content="#15803d" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px;
    }
    .container {
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
    }
    .banner {
      background: #15803d;
      color: #ffffff;
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(21, 128, 61, 0.2);
      margin-bottom: 16px;
    }
    .banner h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 800;
    }
    .banner p {
      margin: 0;
      font-size: 0.92rem;
      opacity: 0.95;
    }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }
    .status-banner {
      display: none;
      padding: 11px 13px;
      border-radius: 9px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      text-align: left;
    }
    .status-success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .status-error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .role-btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 12px;
      transition: opacity 0.15s ease;
    }
    .role-btn:hover { opacity: 0.92; }
    .btn-passenger {
      background: #15803d;
      color: #ffffff;
    }
    .btn-driver {
      background: #2563eb;
      color: #ffffff;
      margin-bottom: 0;
    }
    .sub-links {
      margin-top: 14px;
      font-size: 0.85rem;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .sub-links a {
      color: #475569;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="banner">
      <h1>🚗 ጉዞ ፕላስ (Guzo Plus)</h1>
      <p>ፈጣን እና አስተማማኝ የትራንስፖርት አገልግሎት</p>
    </div>

    <div class="card">
